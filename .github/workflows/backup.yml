name: สำรองฐานข้อมูลรายวัน

# free tier ของ Supabase ไม่มี backup ให้ ถ้าข้อมูลหายคือหายถาวร
# workflow นี้ dump ทุกคืนตี 2 (เวลาไทย) แล้วเก็บไฟล์ไว้ 30 วัน
on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 02:00 ไทย
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: ติดตั้ง postgresql-client-17
        # server เป็น Postgres 17 — pg_dump v16 ของ Ubuntu จะ refuse เพราะ version mismatch
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Dump ฐานข้อมูล
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$DATABASE_URL" --no-owner --no-privileges -f backup-$(date +%F).sql

      - name: เก็บไฟล์
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql
          retention-days: 30
